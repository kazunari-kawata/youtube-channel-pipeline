# 素材台帳：テッド・バンディ事件（第4回・1974〜1978年、ワシントン・ユタ・コロラド・フロリダ）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 004-bundy  → episodes/004-bundy/build/materials/
# url のない項目は手作業で取得する（note に取り方）
#
# この回の注意
# - 被害者の写真・現場写真・歯型（かみ跡）の写真は使わない。被害者の名前は必要な場面だけ
# - フロリダの3人目の被害者は12歳。事実だけを短く。判決文を画面に出すときは名前と遺体の記述の行を映さない
# - 加害者を持ち上げない（「ハンサム」「魅力的」を売りにしない）。焦点は捜査・2度の逃走・州をまたぐ見落とし・裁判
# - 有罪が確定したのは、ユタの誘拐（1976年）とフロリダの3件の殺人。ほかの州の事件は「本人が死刑の直前に認めた」「容疑がかかった」と言い分ける
# - 台帳の状態は調査の初回（2026-11-25）。ページ番号・撮影者はこれから原本で確かめる

case: Ted Bundy（1974〜1978年、ワシントン州・ユタ州・コロラド州・フロリダ州。1989年1月24日に死刑執行）
checked_on: 2026-11-25

items:
  # ---------- FBI（連邦政府の著作物） ----------
  - id: fbi_file
    title: FBIの公開ファイル「Theodore Robert Bundy」（257ページ。1977年6月と12月の逃走の手配、10大手配、1978年2月のフロリダでの逮捕と指紋での確認）
    file: ""
    original: https://purl.fdlp.gov/GPO/LPS97599
    status: pd_federal
    note: 政府刊行物の保存先（FBIの旧FOIAページの保存版）。FBI Vault にも同じファイルがあるはずだが、Vault のURLはまだ自分で開いて確かめていない。FBI職員が書いた文書は著作権なし。綴じ込まれた新聞記事・州や郡の書類はその限りでないので、画面に出すページは1枚ずつ作成者を確かめる。被害者の名前の行は映さない。取得は手作業（ページを決めてから）
  - id: fbi_file_mirror
    title: 同じFBIファイルのミラー（The Black Vault、145ページ版）
    file: fbi/tedbundy_blackvault.pdf
    url: https://documents.theblackvault.com/documents/fbifiles/tedbundy.pdf
    status: reference
    note: ページ数が保存先の説明（257ページ）と違う。中身の確認と文字の検索に使い、画面に出すページは fbi_file の原本から取る
  - id: fbi_top_ten_360
    title: FBI「10大重要指名手配」360番 Theodore Robert Bundy の手配書（1978年2月10日に追加、2月15日にペンサコーラで逮捕）
    file: fbi/top_ten_360.jpg
    original: https://www.fbi.gov/wanted/topten/topten-history/hires_images/FBI-360-TheodoreRobertBundy.jpg/view
    status: pd_federal
    note: FBIの作成。本人の顔写真が載っている → 最初の30秒に出す本人の姿（F-022）の第1候補。手配書の中の写真は地方の警察が撮ったものの可能性があるが、手配書そのものはFBIの刊行物。URL は表示ページなので、画像は手作業で保存する
