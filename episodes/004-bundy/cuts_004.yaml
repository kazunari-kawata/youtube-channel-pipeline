# 004 テッド・バンディ：画面に出す資料（prepare_materials_004.py が読む）
#   name: remotion/public/004/<name>.jpg。台本の visual が src と focus を持つときは <src>__<focus>
#   src:  素材台帳（materials.yaml）の id
#   kind: crop（既定。台帳の file のページから切り出す）／text（判決文の文を紙の上に組み直す）
#   crop: [左, 上, 右, 下]（ページに対する割合）。null は「まだ画像で見て決めていない」
#   redact: [[x0, y0, x1, y1], ...]  切り出す前のページに対する割合で黒く塗る
#
# FBI の文書は The Black Vault の写し（fbi/blackvault_tedbundy.pdf、145ページ）から。FBI の職員が書いたページだけ（新聞の切り抜きは使わない）。
# 被害者の名前と遺体の記述の行は入れない（2026-11-28 に画像で見て位置を決めた）

# ---------- FBI の文書 ----------
- {name: fbi_bv_p30__eyes,   src: fbi_bv_p30, crop: [0.05, 0.18, 0.76, 0.327]}    # 電報の4枚目の頭：本人の特徴（青い目、眼鏡、髪）の4行
- {name: fbi_bv_p29__utah,   src: fbi_bv_p29, crop: [0.05, 0.383, 0.76, 0.470]}   # 3枚目：ユタの有罪と刑の3行（上の黒塗りの行と、下の事件の行は入れない）
- {name: fbi_bv_p28__escape, src: fbi_bv_p28, crop: [0.05, 0.343, 0.76, 0.445]}   # 2枚目：逃げた日時と方法の行（上の被害者の名前と遺体の記述の行は入れない）
- {name: fbi_bv_p40__armed,  src: fbi_bv_p40, crop: [0.04, 0.24, 0.93, 0.585]}    # 通信（1977年6月11日）の宛先・件名・本文・太字の注意（下の配布先と黒塗りは入れない）
- {name: fbi_bv_p92__lead,   src: fbi_bv_p92, crop: [0.04, 0.24, 0.93, 0.70]}     # 通信（1978年1月）の宛先・件名・手がかりの指示と注意（下の配布先は入れない）

