  # ---------- 保安官事務所の映像と写真（カリフォルニア州の郡。権利はユーザーが判断するまで check） ----------
  - id: sso_interview_2020
    title: "シャスタ郡保安官事務所の事情聴取の録画（2020年8月13日、本人と夫、刑事2人。2022年9月20日に公開。約1時間25分）"
    file: ""
    status: check
    note: "公開は判決の翌日（報道各社）。ABC10 が「Raw video」として載せた写し（1時間25分7秒、https://www.youtube.com/watch?v=T7idBeFkj84）は中身の確認にだけ使い、画面には出さない。原本は保安官事務所の公開先を探す。見つからなければカリフォルニア州の公開記録法（CPRA）で請求する（請求の下書きは 007 の records_request.md を参考に）。
      報道で分かっている流れ：刑事が夫に部屋を出てもらうかを本人に尋ねる → 本人は「彼女を見つけないでほしい」と繰り返す → 刑事が DNA は元交際相手のものだったと告げる →「DNAはうそをつかない」→ 本人は泣き崩れる → 20分ほどで夫が退室を求める → 終わり近くに「わたしはひどい人間だ」。この場では罪を認めていない（CBS）。
      夫の顔はぼかす。住所・電話番号が読まれる所は音を消す。この回の主役。権利の判断はユーザー（fair_use にするなら日付を note に）"
  - id: sso_church_video_2016
    title: "発見の直前の監視カメラ映像（2016年11月24日 午前4時15分、ヨロ郡の教会の建物。2017年に保安官事務所が公開）"
    file: ""
    status: check
    note: "撮ったのは教会のカメラ、公開したのはシャスタ郡保安官事務所（報道）。7分後の4時22分にヨロ郡の通報の窓口に電話が入った。原本の公開先を探す。人が小さく映るだけで顔は分からない"
  - id: sso_images_2022
