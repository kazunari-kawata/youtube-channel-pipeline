# 素材台帳：22日間の「誘拐」は作り話だった（第10回・ボディカメラのシリーズ。2016年11月、カリフォルニア州レディング、シェリー・パピーニ事件）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 警察の映像の決まりは CLAUDE.md「警察の映像を使う回のルール」
# 取得：python pipeline/fetch_materials.py 010-papini  → episodes/010-papini/build/materials/
#
# この回の注意
# - シリーズは bodycam。体に付けるボディカメラの映像ではなく、保安官事務所の事情聴取の部屋の録画（2020年8月13日）が主役。
#   このときはまだ逮捕されておらず、事情を聞く場だった。「取調べ」ではなく「事情聴取」と言う
# - 結論は出ている：2022年4月18日に有罪の答弁（郵便詐欺1件、連邦捜査官への虚偽の供述1件）、2022年9月19日に懲役18か月の判決（連邦検事局の発表）。
#   CLAUDE.md「扱うのは、裁判か捜査の結論が出ている事件だけ」に合う
# - 2025年に本人は、本とテレビのシリーズで「元交際相手に連れ去られた」と言い始めた。元交際相手は否定していて、起訴されたことはない（ABC News）。
#   本人の新しい話は「本人の主張」として扱い、裁判の記録（本人の答弁）と並べて言う。どちらが正しいとも言わない。元交際相手の名前は出さない（「元交際相手」と言う）
# - 夫（当時）は、うそをつかれた側。事情聴取の映像に隣に座っている。CLAUDE.md の「顔をぼかす人：被害者」に当たるので、顔をぼかす（本人が取材に出ていても、この回の決まりはぼかす。ユーザーに確かめる）。
#   夫の 911 の通報の録音は使わない。子どもの名前・姿は出さない
# - けがは本人が自分で付けたもの（連邦検事局の発表）。けがの写真・焼き印の写真は使わない。けがの細部も言わない（「自分で付けたものだった」まで）
# - 作り話の中の「ヒスパニック系の女性2人」は実在しない。FBI の似顔絵を出すときは、実在しない人だと同じ区間で言う。
#   この作り話が地域のヒスパニック系の人たちに向けた疑いと不安を生んだことは、検察の書面の言葉として扱う
# - 英語ではこの事件の事情聴取の解説が非常に多い（1,781万回ほか）。日本語の動画は検索で見つからなかった（2026-11-28、vidIQ。表記ゆれは未確認）
# - 台帳の状態は調査の初回（2026-11-28）。連邦の文書は検索結果の抜粋で中身を確かめただけで、まだ保存していない。映像は1本も取得していない

case: United States v. Sherri Papini, 2:22-cr-0070 WBS（カリフォルニア州東部地区連邦地裁。2022年3月3日逮捕、4月18日有罪の答弁、9月19日判決）
series: bodycam
checked_on: 2026-11-28

items:
  # ---------- 連邦の文書（連邦検事局・FBI・連邦地裁。著作権なし） ----------
  - id: usao_affidavit
    title: "逮捕状と刑事告訴を求める FBI 特別捜査官の宣誓供述書（事件番号 3:22-mj-0001 DMC、2022年3月）"
    file: usao/affidavit_2022-03.pdf
    url: https://www.justice.gov/usao-edca/press-release/file/1479901/dl
    status: pd_federal
    note: "FBI サクラメント支局レディング駐在の特別捜査官が書いたもの。検索結果の抜粋で確認した中身：本人は2人のヒスパニック系の女性に連れ去られたと話し、FBI の似顔絵の担当者に2人の特徴を伝え、FBI の捜査官に道具についての文章を送った。元交際相手とは遅くとも2015年12月には連絡を取り合い、プリペイドの携帯電話で話していた。この回の事実の一次資料。画面に出すページは、元交際相手の名前・住所・電話番号を黒塗り（cuts.yaml の redact）"
  - id: usao_information
    title: "起訴状（Information、2:22-cr-0070 WBS、2022年4月12日。郵便詐欺34件と虚偽の供述1件）"
    file: usao/information_2022-04-12.pdf
    url: https://www.justice.gov/usao-edca/press-release/file/1493816/dl
    status: pd_federal
    note: "検索結果の抜粋で確認：本人は約22日間、自分の段取りで、自分の意思で、元交際相手とコスタメサに住んでいた。元交際相手がレンタカーで迎えに来て、レディングの辺りから南のコスタメサまで乗って行った。勤め先の電話と、のちにプリペイドの携帯電話で連絡を取り、自分の携帯電話を持っていたのに使わなかった。元交際相手は文書の中で「Ex-Boyfriend」と書かれている"
  - id: usao_plea
