    status: pd_federal
    note: "検索結果の抜粋で確認：「Missing: 04/01/2006」「最後に分かっている接触は午前1時55分、オハイオ州立大学のそばのバーで友人と飲んでいたとき」、市警の事件番号 060286094、連絡先はコロンバス市警の担当の刑事。名前が初めて出る所の資料（F-039）。担当者の名前とメール・電話は画面の説明で繰り返さない（資料の上はそのまま）"
