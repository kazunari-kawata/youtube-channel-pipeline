    status: pd_federal
    note: "FBI の文章は著作権なし。検索結果の抜粋で確認：2006年4月1日、理由が分からないまま姿を消した。27歳、身長6フィート2インチ、体重160〜165ポンド、茶色の髪、ヘーゼルの目、右の二の腕にパール・ジャムの入れ墨。NamUs の番号 MP#1709。ページの写真は家族の提供とみられるので、文字の部分だけを使う（写真は fbi_vicap_photos で別に確かめる）"
