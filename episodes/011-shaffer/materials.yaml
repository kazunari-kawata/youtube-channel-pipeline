# 素材台帳：バーの防犯カメラは「出る姿」を映していなかった（第11回・2006年4月1日、オハイオ州コロンバス、ブライアン・シェイファーの失踪。未解決）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 011-shaffer  → episodes/011-shaffer/build/materials/
#
# この回の注意
# - 未解決の行方不明。コロンバス市警は2026年4月の時点で「捜査は続いている」（Columbus Dispatch）。本人は見つかっていない。生きているとも亡くなったとも言わない
# - 一緒にいた友人、店の外で話した2人の女性、恋人、ネットや番組で名前が挙がった人は、名前を出さない・ほのめかさない（CLAUDE.md「未解決事件では特定の人をほのめかさない」）。
#   ネット上の書き込みをめぐる名誉毀損の裁判が実際に起きている（2024年の報道）。2026年の「同じ名前の情報が20年ぶりに届いた」という報道も使わない
# - 自死の説（ネットの書き込み）は扱わない。父の死（2008年）は一言だけ、場面にしない
# - 「密室から消えた」と言い切らない。店の出口とエスカレーターにはカメラがあった（2006年の警察の説明）が、工事中の区画と仮設の搬入用エレベーターは映っていなかったと報じられている（MEL Magazine）。
#   「カメラに映る道」と「映らない道」を分けて見せるのが、この回の芯
# - 本人の写真は家族の提供（家族の著作物）。FBI・州のページに載っていても、写真は FBI の作ではない。防犯カメラの静止画（コロンバス市警の提供）を本人の姿の第1候補にする
# - コロンバス市・オハイオ州の文書と画像は州・市の著作物の扱いがフロリダと違う可能性がある。ユーザーが判断するまで check
# - fbi.gov はクラウドからも Windows の作業用シェルからも開けない（403）。Windows の Chrome で開き、保存はユーザーの許可のあと
# - 台帳の状態は調査の初回（2026-11-28）。この会話では WebFetch の許可が取れず、検索結果の抜粋で確かめた。原本はまだ1点も保存していない

case: Disappearance of Brian Shaffer（2006年4月1日 午前1時55分が最後の映像、オハイオ州コロンバス、South Campus Gateway の2階のバー。コロンバス市警の事件番号 060286094）
series: profile
checked_on: 2026-11-28

items:
