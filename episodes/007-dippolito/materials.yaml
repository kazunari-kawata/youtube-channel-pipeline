# 素材台帳：夫の殺害を頼んだ相手は警官だった（第7回・ボディカメラのシリーズ。2009年8月、フロリダ州ボイントンビーチ、ダリア・ディポリト事件）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 警察の映像の決まりは CLAUDE.md「警察の映像を使う回のルール」
#
# この回の注意
# - シリーズは bodycam。体に付けるボディカメラの映像はない（2009年）。使うのは警察の隠しカメラ（車内）、警察の広報が撮った偽の現場、取調室の映像
# - 誰も亡くなっていない。有罪は確定（3回目の裁判で有罪、懲役16年、州の控訴裁判所が支持）。連邦の人身保護の申し立ての結末は一次資料で確かめる
# - 被害者は夫（存命）。映像に映る所は顔をぼかす。夫の過去（報道にある前歴）は、事件の説明に要る範囲だけ
# - 本人の職歴の一部を売り文句にしない。焦点は、通報から3日間の捜査、偽の現場という手法、3回の裁判で争われた点（番組の撮影と捜査の関係、おとり捜査）
# - 弁護側の主張（リアリティ番組のための演技だった、警察が違法に仕向けた）と、裁判所の判断を分けて言う
# - 本人は自宅拘禁の間に子どもを産んでいる。子どもの名前・姿は出さない
# - 情報を持ち込んだ知人の名前は、必要な場面だけ
# - テレビ番組 COPS の撮影班が撮った映像は、警察の映像ではない（制作会社の著作物）。使わない
# - 依頼の金額は報道で食い違う（銃の代金として1,200ドル、3,000ドル、7,000ドル）。宣誓供述書と判決文で確かめるまで、数字を台本・タイトルに入れない
# - 英語では2026年10〜11月に、この事件の動画が小さなチャンネルから多数出ている（YouTube の検索で見た15本のうち10本がこの2か月。
#   その10本の再生は81〜3,427回で、伸びていない。2025年12月の1本は約8.2万回）。
#   どれも「隠しカメラ→偽の現場→取調室→3回の裁判」の順。同じ切り口の焼き直しにしない（問いは構成案でユーザーが決める）
# - 台帳の状態は調査の初回（2026-11-26）。映像はまだ1本も取得していない。取得はユーザーの許可をもらってから

case: State of Florida v. Dalia Dippolito（2009年8月5日逮捕、フロリダ州パームビーチ郡ボイントンビーチ。殺人の依頼＝solicitation to commit first-degree murder）
series: bodycam
checked_on: 2026-11-26

items:
  # ---------- 警察の映像（ボイントンビーチ市警＝フロリダ州の市の機関） ----------
  - id: bbpd_staged_scene
    title: "ボイントンビーチ市警の公式 YouTube「Boynton Beach Police arrest woman in murder for hire plot」（1分19秒、2009年8月5日公開）"
    file: ""
    original: https://www.youtube.com/watch?v=cFhnSej1fQY
    status: check
    note: "2026-11-26 に vidIQ の動画情報で確認：チャンネルは「Boynton Beach Police」（UCl9PV8bQ5Qx0COOxmygwx5w）、公開は 2009-08-05 15:50 UTC（逮捕の当日）、再生約54.3万回。概要欄は市警の文で、夫は死んだと告げたこと、依頼の相手が潜入の警官だったこと、殺人の依頼の疑いで立件することが書いてある。映像は未視聴。市警の広報が撮ったものと報じられているが、COPS の撮影班の映像が混じっていないかを見て確かめてから pd_other にする（フロリダの公的記録。Microdecisions v. Skinner、2004年）。取得はユーザーの許可のあと"
  - id: bbpd_uc_car
    title: 潜入の警官の車内の隠しカメラ（2009年8月3日、薬局の駐車場。約23分）
    file: ""
    status: check
    note: "原本は未入手。公開記録の請求で取る（records_request.md）。写しはパームビーチ・ポスト紙の YouTube（https://www.youtube.com/watch?v=0t-I6jhQZWE 、23分18秒、2018年公開）にあるが、新聞社の載せた写しは使わない（中身の確認にだけ使う）。「5,000パーセント確かだ」という発言はこの映像（報道）。日付は報道と他の資料からで、宣誓供述書で確かめる"
  - id: bbpd_informant_car
