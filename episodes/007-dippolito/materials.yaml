    file: ""
    status: check
    note: 原本は未入手。公開記録の請求で取る。警察が知人の車にカメラを付けて録ったと報じられている（ABC）。日付は宣誓供述書で確かめる
  - id: bbpd_interview_dalia
    title: 取調室の録画（2009年8月5日、本人。約31分）
    file: ""
    status: check
    note: "原本は未入手。公開記録の請求で取る。写しは Law&Crime Network の YouTube（https://www.youtube.com/watch?v=CGZXTuUrcXQ 、30分53秒）などにあるが使わない。流れ（写しの概要欄による。原本で確かめる）：権利の告知 → COPS の撮影の同意書に署名 → 「殺し屋」役の警官が連れて来られる → 逮捕を告げられる → 夫が現れる。夫が映る所は顔をぼかす。同意書の場面は、3回の裁判で争われた点なので使いどころになる"
