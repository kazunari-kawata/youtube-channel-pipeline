# 006 アルカトラズ脱獄：画面に出す切り出し（prepare_materials_006.py が読む）
#   name: remotion/public/006/<name>.jpg。台本の visual.src と同じ名前。同じ資料の別の行は <src>__<focus>
#   src:  素材台帳（materials.yaml）の id。ファイルとページは台帳の file から取る（「#page=N」がページ）
#   crop: [左, 上, 右, 下]（ページ・写真に対する割合）。null は「まだ画像で見て決めていない」。null のものは作らない
#   redact: [[x0, y0, x1, y1], ...]  切り出す前のページに対する割合で黒く塗る（名前・住所など）
#
# FBI と連邦保安官局の資料・写真は、1枚ずつ画像で見て crop を書く（台帳の note の「入れない段落」を外す。黒塗りはそのまま）。
# クラウドからは fbi.gov・usmarshals.gov が開けない（403）。取り方は docs/browser-downloads.md

# ---------- 議会図書館（HABS CA-1792-A）：2026-11-28 に取得して画像で確かめた ----------
# 写真の番号の札（HABS No. CA-1792-A-3 / A-24）とフィルムの黒い縁は入れない
- {name: loc_habs_exterior,  src: loc_habs_exterior,  crop: [0.03, 0.05, 0.945, 0.965]}   # A-3：運動場から見た房棟と給水塔（階段の人は小さく、顔は分からない）
- {name: loc_habs_cellhouse, src: loc_habs_cellhouse, crop: [0.045, 0.045, 0.965, 0.975]}  # A-24：房棟の中の通路（Bブロックと Cブロックの間）

# ---------- FBI の写真（fbi.gov の公式ページの原寸 @@images/image）：2026-11-28 に取得して画像で確かめた ----------
# 北東の岸の航空写真といかだの写真は、今の fbi.gov のページに載っておらず、大きい版が手に入らないので使わない（台本で替えた）
- {name: fbi_dummy_head_side, src: fbi_dummy_head_side, crop: [0.0, 0.02, 0.98, 0.99]}    # 頭の全体（首の書き込みも資料のまま）
- {name: fbi_mugshots,        src: fbi_mugshots,        crop: [0.0, 0.0, 1.0, 1.0]}       # 3枚を並べたもの（prepare_materials_006.py の compose_mugshots）
- {name: fbi_dummy_head_bed,  src: fbi_dummy_head_bed,  crop: [0.22, 0.0, 1.0, 0.74]}     # 格子・ヘッドホン・枕の頭と毛布。眠っている人に見える（それがだました仕掛け）
- {name: fbi_ev_vent_grille,  src: fbi_ev_vent_grille,  crop: [0.02, 0.14, 0.80, 0.90]}   # 洗面台の下の穴と格子
- {name: fbi_ev_roof_vent,    src: fbi_ev_roof_vent,    crop: [0.035, 0.015, 0.975, 0.93]} # 写真の白い縁は入れない
- {name: fbi_ev_paddle,       src: fbi_ev_paddle,       crop: [0.02, 0.10, 1.0, 0.85]}    # 原寸が 636x420 と小さい（これより大きい版はない）
- {name: fbi_ev_lifevest,     src: fbi_ev_lifevest,     crop: [0.12, 0.12, 1.0, 0.98]}    # 左上の格子のかけらは入れない

