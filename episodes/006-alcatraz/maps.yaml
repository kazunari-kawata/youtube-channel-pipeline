# 地図の範囲と地名（pipeline/make_maps.py）。006 アルカトラズ脱獄（1962年）
# note は画面に出る。見方に関わる注記（「模式図」「およその範囲」など）だけを書き、制作上の配慮は書かない（F-016）
#
# 決まり（構成案 2026-11-26）
# - 地図は北を上に固定し、動かさない。点と矢印を順に出す（拡大・移動はチラつく）
# - 3人が進んだ経路は分かっていないので、海の上に経路の線は引かない
# - 見つかった物の点には日付を付ける（拾われたのは1〜4日後。潮は午前4時に向きを変えているので、点の場所＝流れた先ではない）
# - 文書によって場所の書き方が食い違う物（包み）は、点ではなく範囲で出す
# - 貨物船の報告（7月17日、金門橋の西北西約20マイル）は地図に出さない（だれのものか分かっていない）
#
# 位置の出典（FBI Vault の分冊:ページ。timeline.md）
#   エンジェル島：アルカトラズの北約1と4分の1マイル（5:44）
#   櫂：6月12日午後10時15分ごろ、エンジェル島のスチュアート岬とノックス岬の中ほど、岸から100〜200ヤード沖（7:21）
#   包み2つ：6月14日、アルカトラズの東約半マイルの渦（5:44、15:41）。7:26 は別の書き方（灯台から33度・約3,200ヤード）で食い違う → 範囲
#   救命胴衣：6月15日、クロンカイト・ビーチ（金門橋の西約3と4分の3マイル、太平洋側。1:78）。15:41 は「3と4分の1マイル」
# 緯度経度は一般の地名からの概算。公開前に USGS の地名辞典と当時の地形図で確かめる
places:
  alcatraz: {lat: 37.8267, lon: -122.4230, label: "アルカトラズ島"}
  angel_island: {lat: 37.8609, lon: -122.4326, label: "エンジェル島"}
  sf: {lat: 37.8080, lon: -122.4177, label: "サンフランシスコ"}
  sausalito: {lat: 37.8591, lon: -122.4853, label: "マリン郡"}
  golden_gate: {lat: 37.8199, lon: -122.4783, label: "金門橋"}
  # 要確認：スチュアート岬（西の端）とノックス岬（南西）の中ほどの沖。岬の座標を地形図で確かめてから置き直す
  paddle: {lat: 37.8575, lon: -122.4465, label: "櫂（6月12日夜）"}
  # 要確認：範囲の中心の目安（アルカトラズの東約0.8km）。範囲で描く
  packets: {lat: 37.8267, lon: -122.4138, label: "包み2つ（6月14日。およその範囲）", kind: area}
  cronkhite: {lat: 37.8320, lon: -122.5390, label: "救命胴衣（6月15日）"}
  # 距離の表示を置く場所（アルカトラズとエンジェル島の間）
  dist: {lat: 37.8440, lon: -122.4200, label: "約2km", kind: text}
  # 潮の矢印（模式図）。島の東の湾の中 → 金門橋 → 太平洋
  tide_a: {lat: 37.8330, lon: -122.4050, label: ""}
  tide_b: {lat: 37.8199, lon: -122.4783, label: ""}
  tide_c: {lat: 37.8050, lon: -122.5600, label: "太平洋へ"}

views:
  bay:        # 湾の全体（第1章の島の紹介、第3章の「日付の順に置く」）
    lon: [-122.60, -122.36]
    lat: [37.76, 37.92]
    points: [alcatraz, angel_island, golden_gate, sf]
    labels:
      - {lat: 37.90, lon: -122.53, text: "マリン郡"}
      - {lat: 37.775, lon: -122.44, text: "サンフランシスコ"}
      - {lat: 37.79, lon: -122.57, text: "太平洋", kind: water}
      - {lat: 37.845, lon: -122.39, text: "サンフランシスコ湾", kind: water}
  plan:       # 計画：島とエンジェル島の2点、「約2km」。線なし
    lon: [-122.47, -122.39]
    lat: [37.815, 37.875]
    points: [alcatraz, angel_island, dist]
  tide:       # 潮の向き（陸軍工兵隊の事務所の説明：5:48）
    lon: [-122.60, -122.36]
    lat: [37.76, 37.92]
    points: [alcatraz, golden_gate]
    route: [tide_a, tide_b, tide_c]
    note: "矢印は潮の向き。陸軍工兵隊の事務所の説明による模式図（1962年6月11日 午後10時より後）"
  north:      # 櫂：エンジェル島の沖
    lon: [-122.47, -122.40]
    lat: [37.835, 37.885]
    points: [angel_island, paddle]
    note: "点はおよその場所"
  east:       # 包み：アルカトラズの東
    lon: [-122.45, -122.38]
    lat: [37.805, 37.850]
    points: [alcatraz, packets]
    note: "範囲はおよその場所"
  west:       # 救命胴衣：金門橋の外の浜
    lon: [-122.58, -122.44]
    lat: [37.78, 37.87]
    points: [golden_gate, cronkhite]
    labels:
      - {lat: 37.80, lon: -122.555, text: "太平洋", kind: water}
  search:     # 捜索の範囲（5:43。湾の中と、金門橋の南北の海岸）
    lon: [-122.60, -122.36]
    lat: [37.76, 37.92]
    points: [alcatraz, angel_island, golden_gate, cronkhite]
    note: "塗った所は、艇とヘリコプターが捜した範囲の模式図"
  mainland:   # 点のない対岸（盗難車、連絡なし）
    lon: [-122.56, -122.36]
    lat: [37.77, 37.90]
    points: [sf, sausalito]
  finds:      # 湾の全体に、見つかった物の3つの点（日付つき）。第3章の判定では潮の矢印も出す
    lon: [-122.60, -122.36]
    lat: [37.76, 37.92]
    points: [alcatraz, paddle, packets, cronkhite]
    route: [tide_a, tide_b, tide_c]
    note: "点は見つかった場所（およそ）と日付。矢印は潮の向きの模式図"
