# 素材台帳：アルカトラズ脱獄（第6回・1962年6月11〜12日、カリフォルニア州サンフランシスコ湾、3人の行方は不明）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 006-alcatraz  → episodes/006-alcatraz/build/materials/
# url のない項目は手作業で取得する（note に取り方）
#
# この回の注意
# - 被害者も遺体も出てこない回。3人は銀行強盗などで有罪が確定した受刑者で、脱獄そのものも事実として確定している
# - 分かっていないのは「湾を渡れたか」。FBIの結論（生存の信頼できる証拠なし）と、連邦保安官局が手配を続けたことを分けて言う。
#   「生きていた」とする家族の主張・2013年の手紙・写真は、主張として扱う（FBIの鑑定は結論なし）。断定しない
# - 脱獄の手口は、FBIの公式ページが書いている粗さまで（通気口から裏の通路、屋根、煙突、岸）。
#   道具の作り方・いかだの継ぎ方などの手順は細かく描かない（CLAUDE.md「犯行の手順を描写しない」）
# - 加害者を持ち上げない。「天才」「伝説の脱獄王」と売らない。焦点は、点検の穴、捜索、FBIと保安官局の結論の違い
# - 4人目（Allen West）は脱獄できず、捜査に協力した受刑者。名前は必要な場面だけ
# - 台帳の状態は調査の初回（2026-11-25）。FBIファイルのページ番号と写真1枚ごとの撮影者は、これから原本で確かめる

case: June 1962 Alcatraz escape（1962年6月11日夜〜12日朝、アルカトラズ連邦刑務所。Frank Morris、John Anglin、Clarence Anglin）
checked_on: 2026-11-25

items:
  # ---------- FBI（連邦政府の著作物） ----------
  - id: fbi_vault
    title: FBI Vault「Alcatraz Escape」（捜査ファイル。保存先の説明では1,757ページ）
    file: ""
    original: http://vault.fbi.gov/Alcatraz%20Escape
    status: pd_federal
    note: 政府刊行物の保存先は https://purl.fdlp.gov/GPO/LPS97352。FBI職員が書いたメモ・テレタイプ・報告は著作権なし。綴じ込まれた新聞記事と、刑務所局・沿岸警備隊など他機関の書類は作成者を1枚ずつ確かめる（連邦機関の書類なら使用可、新聞は不可）。取得は手作業（ページを決めてから）。探すページ：6月12日の第一報、捜索の報告、West の供述の要約、回収物の鑑定、1979年の終結のメモ
  - id: fbi_famous_case
    title: "FBI公式「Famous Cases: Alcatraz Escape」（事件の経過とFBIの結論。写真14点）"
    file: fbi/famous_cases_alcatraz.html
    url: https://www.fbi.gov/history/famous-cases/alcatraz-escape
    status: pd_federal
    note: 台本の事実の柱。1934〜63年に14回・36人が脱獄を試みた、3人の到着の時期、6月12日朝の点検、回収物、17年間の捜査で生存の信頼できる証拠なし。写真は下の項目に分けた
  - id: fbi_2007_story
    title: "FBI公式「A Byte Out of History: Escape from Alcatraz」（2007年6月8日。写真12点）"
    file: fbi/byte_out_of_history_2007.html
    url: https://www.fbi.gov/news/stories/2007/june/alcatraz_060807/
    status: pd_federal
    note: 数字の出典。いかだは6×14フィート、レインコート50着以上、天井まで30フィート、煙突45フィート、エンジェル島まで1マイル余り、1979年12月31日にFBIが捜査を終え連邦保安官局へ引き継ぎ
  - id: fbi_mugshots
