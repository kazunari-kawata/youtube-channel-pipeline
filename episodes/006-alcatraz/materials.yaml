  - id: own_footage_2026
    title: ユーザーが2026年夏にアルカトラズ島で撮った映像（現在の島・房・湾の眺め）
    file: own/footage_2026/
    status: check
    note: "ユーザー本人の撮影なので権利は本人にある。中身を見てから使用可（own）にする。確かめること：(1) ほかの観光客の顔が大きく映る所は使わない (2) 音は使わない（館内の音声ガイド、展示の音、周りの会話が入る） (3) 展示パネルに載った報道写真・映画のスチールが大きく映る所は使わない (4) 撮影は国立公園局の決まりの範囲か（8人以下・手持ちの機材・公開区域なら許可も料金も不要。nps.gov の EXPLORE Act の案内） (5) 画面には「2026年撮影」と出す。1962年の記録映像に見える加工（白黒、傷、古いフィルム風）はしない。パイプラインに実写の動画を出す仕組み（video）がまだないので、足す前にユーザーに伝える"
