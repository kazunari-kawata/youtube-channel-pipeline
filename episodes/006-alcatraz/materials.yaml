# 素材台帳：アルカトラズ脱獄（第6回・1962年6月11〜12日、カリフォルニア州サンフランシスコ湾、3人の行方は不明）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 006-alcatraz  → episodes/006-alcatraz/build/materials/
# url のない項目は手作業で取得する（note に取り方）
#
# この回の注意
# - 被害者も遺体も出てこない回。3人は銀行強盗などで有罪が確定した受刑者で、脱獄そのものも事実として確定している
# - 分かっていないのは「湾を渡れたか」。FBIの結論（生存の信頼できる証拠なし）と、連邦保安官局が手配を続けたことを分けて言う。
#   「生きていた」とする家族の主張・2013年の手紙・写真は、主張として扱う（FBIの鑑定は結論なし）。断定しない
# - 脱獄の手口は、FBIの公式ページが書いている粗さまで（通気口から裏の通路、屋根、煙突、岸）。
#   道具の作り方・いかだの継ぎ方などの手順は細かく描かない（CLAUDE.md「犯行の手順を描写しない」）
# - 加害者を持ち上げない。「天才」「伝説の脱獄王」と売らない。焦点は、点検の穴、捜索、FBIと保安官局の結論の違い
# - 4人目（Allen West）は脱獄できず、捜査に協力した受刑者。名前は必要な場面だけ
# - 台帳の状態は調査の初回（2026-11-25）。FBIファイルのページ番号と写真1枚ごとの撮影者は、これから原本で確かめる

case: June 1962 Alcatraz escape（1962年6月11日夜〜12日朝、アルカトラズ連邦刑務所。Frank Morris、John Anglin、Clarence Anglin）
checked_on: 2026-11-25

items:
  # ---------- FBI（連邦政府の著作物） ----------
  - id: fbi_vault
    title: FBI Vault「Alcatraz Escape」（捜査ファイル。保存先の説明では1,757ページ）
    file: ""
    original: http://vault.fbi.gov/Alcatraz%20Escape
    status: pd_federal
    note: 政府刊行物の保存先は https://purl.fdlp.gov/GPO/LPS97352。FBI職員が書いたメモ・テレタイプ・報告は著作権なし。綴じ込まれた新聞記事と、刑務所局・沿岸警備隊など他機関の書類は作成者を1枚ずつ確かめる（連邦機関の書類なら使用可、新聞は不可）。選んだページは下の fbi_v◯◯_p◯◯◯ の項目
    access: "2026-11-25：ユーザーがブラウザで17分冊のPDF（alcatr1〜17.pdf、計1,856ページ、77MB）を保存し、build/materials/fbi/ に置いた（Gitには入らない）。PDFの文字の層は読み取りが粗いので、検索で当たりを付けてからページを画像で確かめる。全ページの文字は build/materials/alcatraz_text.jsonl"
  - id: fbi_v02_p035
    title: "FBI捜査概要報告（サンフランシスコ支局、1962年6月19日）の表紙と概要"
    file: fbi/alcatr2.pdf#page=35
    status: pd_federal
    note: 画像で確認済み。FBIの様式（FD-204）。午前7時15分に3人の不在と人形の頭を発見、壁の穴・配管の通路・屋根・北東の岸という経路、4人目は午後9時37分ごろに3人が出たあと穴を広げて屋根へ出たが姿がなく房へ戻った、いかだは6×14フィートでレインコート製、行き先の計画はエンジェル島から本土（侵入盗で銃と服、それから車を盗む）。黒塗り（b7C）は4人目の名前。第一報の画面の第一候補
  - id: fbi_v02_p005
    title: "FBI本部のメモ（Evans から Belmont へ、1962年6月14日）"
    file: fbi/alcatr2.pdf#page=5
    status: pd_federal
    note: 画像で確認済み。「本土に着いた証拠はまだない。着かなかったことを示す情報もない」。櫂はエンジェル島の岸から100〜200ヤード沖で発見、これだけが島に着いた可能性を支えるが決め手ではない。残された救命胴衣はレインコート製で、継ぎ目を熱い蒸気の管で張り合わせたとみられる、という支局長の報告。記者の動きに触れた段落は使わない
  - id: fbi_v05_p033
    title: "FBI報告（1962年7月18日）の表紙と概要"
    file: fbi/alcatr5.pdf#page=33
    status: pd_federal
    note: 画像で確認済み。本土に着いたことを示す情報なし、遺体は引き潮で外海へ運ばれた可能性があり発見は難しい、親族・受刑者・知人への聞き取りでも連絡の形跡なし、いかだは一度も浮かべて試していないという4人目の話。目次は同じ分冊の35ページ
  - id: fbi_v05_p044
    title: "FBI報告（1962年7月18日）捜索の章：金門橋、エンジェル島、陸軍工兵隊の清掃船"
    file: fbi/alcatr5.pdf#page=44
    status: pd_federal
    note: 画像で確認済み。エンジェル島はアルカトラズの北約1と4分の1マイル。6月12日に軍警察35人、翌日は兵士134人とFBI捜査官が100棟を超える空き家を含めて捜索し、島に着いた形跡なし。6月14日に清掃船がアルカトラズの東約半マイルの渦で包みを2つ回収。捜索の画面の第一候補
  - id: fbi_v04_p087
    title: "FBI本部の報告メモ（特別捜査部、1962年7月2日）潮と水温"
    file: fbi/alcatr4.pdf#page=87
    status: pd_federal
    note: 画像で確認済み。陸軍工兵隊の事務所の見方として、6月11日の潮では浮いた体は金門橋の下を通って太平洋へ流れる、エンジェル島に着くのは難しかった、水温は華氏50〜54度。手書きの書き込みあり（読めない部分は説明に使わない）
  - id: fbi_v07_p006
    title: "FBIの聞き取り・押収の記録（FD-302、1962年6月22日付）ジョン・アングリンの房から出た物"
    file: fbi/alcatr7.pdf#page=6
    status: pd_federal
    note: 画像で確認済み。人形の頭1つ、厚紙とせっけんで作り房の色に塗った偽の通気口の格子、緑の塗料、のこぎりの刃、ゴムの張り合わせ方が載った雑誌（1960年11月号、154〜155ページ）、肌色の塗料など。雑誌の名前は画面に出てよいが、表紙や誌面そのものは使わない
  - id: fbi_v07_p042
    title: "FBIの聞き取りの記録（FD-302）4人目の受刑者の話：救命胴衣、いかだ、楽器を使った空気入れ"
    file: fbi/alcatr7.pdf#page=42
    status: check
    note: 文字の層だけで確認（画像は未確認）。レインコートを切って貼り合わせた、いかだは約6×14フィート、モリスが買った楽器（コンサーティーナ）をふいごに作り替えた、6月11日午後7時ごろ2人が屋根へ。同じ話の別の写しが分冊4の119〜124ページ。名前は黒塗り
  - id: fbi_v11_p042
    title: "FBI報告：ノルウェーの貨物船の乗組員が見たという遺体（聞き取りは1962年10月18日）"
    file: fbi/alcatr11.pdf#page=42
    status: pd_federal
    note: 画像で確認済み。1962年7月17日の午後5時45分〜6時、金門橋の西北西約20マイルで、うつぶせに浮く遺体を双眼鏡で見たという話。米国の無線の周波数を持たず、報告は8月8日になった。だれの遺体かは分かっていない（FBIは3人のだれかとは断定していない）。遺体の描写の文は画面の説明に使わない
  - id: fbi_v15_p086
    title: "FBIの通信（サンフランシスコ支局から本部、1979年12月31日）連邦保安官局への引き継ぎ"
    file: fbi/alcatr15.pdf#page=86
    status: pd_federal
    note: 画像で確認済み。1979年12月31日に事件を連邦保安官（サンフランシスコ）へ移した、手配書の番号は305〜307。手書きの書き込みと受付印が多い。終結の画面の第一候補。予告は同じ分冊の81ページ（12月27日付）
  - id: fbi_v15_p078
    title: "FBIのメモ（サンフランシスコ支局、1979年1月19日）映画の製作中に寄せられた話の確認"
    file: fbi/alcatr15.pdf#page=78
    status: check
    note: 文字の層だけで確認。映画会社から届いた手紙の主に聞き取り、すべて伝聞で、3人が岸に着いたという具体的な情報はないと確認。メキシコからの絵はがきの話もここ。使うなら「うわさをFBIが確かめた」例として。映画の題名を画面で強調しない
  - id: fbi_v06_p013
    title: "FBI報告：所長あてに届いた絵はがき（1962年6月16日の消印）と筆跡の鑑定"
    file: fbi/alcatr6.pdf#page=13
    status: check
    note: 文字の層だけで確認。6月18日に所長が提出、FBIの鑑定で筆跡はクラレンス・アングリンのものではないとされた（14ページ）。所長の名前が出る
  - id: fbi_v03_p090
    title: "FBI鑑識の作業票（1962年7月）回収物の一覧：救命胴衣、いかだの浮き、櫂、電動ドリル"
