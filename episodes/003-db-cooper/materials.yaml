    note: FBI職員が書いたメモ・報告・写真は著作権なし。綴じ込まれた新聞記事・他機関の書類・個人の手紙はその限りでないので、画面に出すページは1枚ずつ作成者を確かめる。容疑者の名前が載ったページは画面に出さない。最初の公開分（Part 01〜17）は政府刊行物の保存先 https://purl.fdlp.gov/GPO/LPS97624 にもある。取得は手作業（ページを決めてから）
