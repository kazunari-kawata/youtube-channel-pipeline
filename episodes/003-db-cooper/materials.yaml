    title: FBI公式ページ「D.B. Cooper Hijacking」（本文と写真7点：似顔絵、ネクタイ、1980年に見つかった紙幣2点、パラシュートの袋、残されたパラシュート、使われなかったパラシュート）
    file: fbi/famous_case/
    original: https://www.fbi.gov/history/famous-cases/db-cooper-hijacking
    status: pd_federal
