# 素材台帳：D.B.クーパー事件（第3回・1971年のハイジャック、未解決）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status（権利の状態）の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 003-db-cooper  → episodes/003-db-cooper/build/materials/
# url も naip もない項目は手作業で取得する（note に取り方）
#
# この回の注意
# - 未解決事件。容疑者として名前が挙がった人の写真・名前・説は、画面にもナレーションにも出さない（CLAUDE.md「特定の人をほのめかさない」）
# - 乗務員・乗客はハイジャックの被害者。写真は使わず、名前も必要な場面だけ
# - 1980年に紙幣を見つけたのは当時8歳の子ども。事実だけを短く、名前は出さない

case: D.B. Cooper（NORJAK、1971年11月24日、オレゴン州ポートランド〜ワシントン州南西部）
checked_on: 2026-11-25

items:
  # ---------- FBI（連邦政府の著作物） ----------
  - id: fbi_vault
    title: FBI Vault「D. B. Cooper」（NORJAK の捜査ファイル。1971年11月〜1992年5月。2025年に追加公開あり）
    file: ""
    original: https://vault.fbi.gov/D-B-Cooper%20
