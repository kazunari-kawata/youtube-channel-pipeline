# 素材台帳：ガードナー美術館の盗難（第9回・1990年3月18日、マサチューセッツ州ボストン。13点が盗まれ、犯人は起訴されず、1点も戻っていない）
#
# 1素材＝1項目。動画に出すものは、必ずここに載せてから使う（CLAUDE.md）。
# status の意味は episodes/002-dahmer/materials.yaml の冒頭と pipeline/fetch_materials.py の STATUS を参照
#   pd_federal / pd_no_notice / pd_other / cc_by / fair_use / own → 使用可
#   check → 要確認（画面に出さない） / reference → 参照のみ / unusable → 使用不可
# 取得：python pipeline/fetch_materials.py 009-gardner  → episodes/009-gardner/build/materials/
# url のない項目は手作業で取得する（note に取り方）
#
# この回の注意
# - 未解決事件。FBI は2013年に「犯人を特定した」と発表し、2015年に「2人はすでに死亡」と述べたが、名前は出していない。
#   報道や本で名前が挙がった人（盗品の所持を疑われた人、元受刑者など）は、画面にもナレーションにも出さない（CLAUDE.md「未解決事件では特定の人をほのめかさない」）
# - 当夜の警備員2人の名前は出さない。「決まりを破って通した」は美術館の公式の説明として言ってよいが、関与をほのめかす言い方・並べ方をしない。
#   前夜の映像の男は「連邦検事局が身元を探している人物」として扱う。人感センサーの記録をもとに特定の人を疑う説（報道にある）は使わない
# - 盗み方の手順（縛り方、額からの切り取り方）は細かく描かない。言うのは「地下で縛られた」「額から切り取られた絵があった」の粗さまで
# - 金額は「FBI・連邦検事局が言う少なくとも5億ドル（1990年代以降の評価）」。円は公開日の相場で換算し、換算した日を plan.md に書く
# - 盗まれた絵そのものは、作者の死後数百年たったパブリックドメインの平面の作品。写真の写しは、米国では忠実な複製に新しい著作権が生じない（Bridgeman v. Corel、1999年）。
#   Commons のファイルページで PD-Art の表示を1枚ずつ確かめてから pd_other にする。立体（青銅の器、旗の飾り）の写真は撮った人に権利があるので別に確かめる
# - fbi.gov はクラウドからも Windows の作業用シェルからも開けない（403）。Windows の Chrome（Claude in Chrome）で開き、保存はユーザーの許可のあと（制作の引き継ぎ「fbi.gov の素材の取り方」）
# - 台帳の状態は調査の初回（2026-11-28）。この会話では WebFetch の許可が取れず、検索結果の抜粋で確かめた。原本はまだ1点も開いていない

case: Isabella Stewart Gardner Museum theft（1990年3月18日 午前1時24分〜2時45分ごろ、ボストンのイザベラ・スチュワート・ガードナー美術館。13点、少なくとも5億ドル）
series: profile
checked_on: 2026-11-28

items:
  # ---------- FBI・連邦検事局（連邦政府の著作物） ----------
  - id: fbi_gardner_page
    title: "FBI の特設ページ「The Gardner Museum Theft」（2013年3月18日、盗難から23年の日に開設）"
    file: ""
    original: https://www.fbi.gov/gardner
    status: pd_federal
    note: "FBI の文章は著作権なし。2013年の会見の要旨（ボストン支局の特別捜査官の言葉：絵は盗難のあとの数年でコネチカットとフィラデルフィアの地域へ運ばれた、いまの場所は分からない）がある（検索結果の抜粋で確認）。ページに載っている写真（盗まれた作品の写真、空の額）は美術館の提供の可能性があるので、画像は1枚ずつ別の項目で確かめる。開くのは Windows の Chrome"
  - id: fbi_suspect_sketches
    title: "FBI の画像「Sketches of Suspects」（1990年3月18日の盗難の2人の似顔絵）"
    file: ""
    original: https://www.fbi.gov/image-repository/gardner-suspects.jpeg/view
    status: check
    note: "FBI のページの説明では、米国で最大の財産犯罪の容疑者の似顔絵。描いたのが FBI かボストン市警かが未確認（市警なら州・市の著作物で check のまま）。名前の分からない2人の似顔絵なので、出しても特定の人をほのめかすことにはならない。F-022（最初の30秒の人物）の候補"
  - id: fbi_artwork_composite
    title: "FBI の画像「Composite of Stolen Artwork」（盗まれた13点を並べた画像）"
    file: ""
    original: https://www.fbi.gov/gardner
    status: check
    note: 特設ページの見出しに出てくる画像（検索結果の見出しで確認）。作品の写真は美術館の撮影の可能性があるので、Commons の写し（下の art_◯◯）と見比べて、使うならどちらかに決める
  - id: fbi_yt_2013_reward
    title: "FBI 公式 YouTube「Gardner Museum in Boston Offering $5 Million Reward for Stolen Art」（2分1秒、2013年3月18日公開）"
    file: ""
    original: https://www.youtube.com/watch?v=6DpD1HbcFfQ
    status: check
    note: "2026-11-28 に vidIQ の検索結果で確認：チャンネルは「FBI – Federal Bureau of Investigation」、再生約10.6万回。FBI が作った映像は pd_federal だが、中に美術館の写真・映像が入っている可能性があるので、見て確かめてから分ける。懸賞金はいまは1,000万ドル（この映像は当時の500万ドル）"
  - id: fbi_yt_2013_sac
    title: "FBI 公式 YouTube「Gardner Museum Thefts: FBI Special Agent in Charge Richard DesLauriers」（1分39秒、2013年3月18日公開）"
    file: ""
    original: https://www.youtube.com/watch?v=EyNdZmrqNFE
    status: pd_federal
    note: "2026-11-28 に vidIQ の検索結果で確認。FBI ボストン支局の特別捜査官（当時）の発表。FBI の職員が職務で話した映像。2013年の「特定した」「コネチカットとフィラデルフィア」の一次の出どころ。映像は未視聴（使う区間は見てから決める）"
  - id: fbi_yt_2013_museum
    title: "FBI 公式 YouTube「Gardner Museum Thefts: Gardner Security Director Anthony Amore」（3分17秒、2013年3月18日公開）"
    file: ""
    original: https://www.youtube.com/watch?v=6XArJWQBhpo
    status: check
    note: 2026-11-28 に vidIQ の検索結果で確認。FBI が作った映像だが、話しているのは美術館の警備責任者（美術館の職員）で、館内の映像は美術館の許可で撮ったもの。使うかどうかと権利の状態はユーザーと決める。事実確認には使える
  - id: usao_2015_release
    title: "マサチューセッツ州連邦検事局の発表「Historic Footage Connected to Gardner Museum Burglary Released - Public Assistance Sought」（2015年8月6日）"
    file: ""
    original: https://justice.gov/usao-ma/pr/historic-footage-connected-gardner-museum-burglary-released-public-assistance-sought
    status: pd_federal
    note: "連邦検事局の文章は著作権なし。要旨（検索結果の抜粋で確認）：盗難の前夜、同じ扉から無許可の人物が入った。車が裏口の横に止まり、降りた男が美術館の決まりに反して警備員に中へ入れられる。車は盗難の直前に外に止まっていたと報告された車の特徴と合う。犯人は当夜の監視の録画を持ち去ったが、前夜の分は持ち去らなかった。発表文を Windows の Chrome で保存して、資料の画面に出す"
  - id: usao_2015_video
    title: "盗難の前夜の監視カメラ映像（1990年3月17日 午前0時49分ごろ、6分39秒。2015年8月6日に連邦検事局と FBI が公開）"
    file: ""
    original: http://www.justice.gov/usao-ma/gardner-museum-theft
    status: check
    note: "撮ったのは美術館の監視カメラ、公開したのは連邦検事局と FBI（報道では FBI の YouTube にも載った）。連邦機関が撮った映像ではないので pd_federal にしない。ユーザーが使うと判断したら fair_use（日付を note に）。入手は連邦検事局のページか FBI の公式 YouTube から（ニュース局の写しは使わない）。長さは 6分39秒（WBUR）と 6分40秒（ロイター）の報道。前夜の映像に映る警備員の顔は、当夜の当事者の1人なので、出し方をユーザーと決める（ぼかす案）"
  - id: usao_fbi_2013_release
    title: "FBI ボストン支局・連邦検事局の発表文（2013年3月18日）「FBI Provides New Information Regarding the 1990 Isabella Stewart Gardner Museum Art Heist」"
    file: ""
    status: pd_federal
    note: "WGBH の記事に全文の引用がある（検索結果の抜粋）。FBI の原文を fbi.gov（ボストン支局のプレスリリース）で探して保存する。要旨：犯人の身元は高い確度で分かっている、犯人は中部大西洋岸とニューイングランドを拠点にする犯罪組織の者、絵はコネチカットとフィラデルフィアの地域へ運ばれた、時効は過ぎている。取得したら URL を original に書く"
