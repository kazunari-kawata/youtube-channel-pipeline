# チャンネル共通の設定。回ごとに変えたいときは episodes/<id>/episode.yaml に同じキーを書いて上書きする。

video:
  fps: 30
  width: 1280          # Remotion上の作業解像度（文字やラベルはこの座標で配置）
  height: 720
  render_scale: 1.5    # 書き出し時の倍率。1.5 → 1920x1080

tts:
  provider: elevenlabs
  voice_id: 3JDquces8E8bkmvbh6Bc    # Otani（日本語の男性、落ち着いた語り。2026-11-25 ユーザーが試聴して選定。Jun は低すぎて不採用：F-017）
  model_id: eleven_v3              # v2 より日本語が自然（F-017 の聞き比べ）。使えるモデルは tts_voice_samples.py --models で確認
  language_code: ja                # v3系では指定する。multilingual_v2 なら null
  output_format: mp3_44100_128     # 全プランで使える形式
  voice_settings: null             # 声の初期値（試聴で選んだサンプルと同じ）。v2 に戻すなら stability 0.5 / similarity_boost 0.75 など
  stitch: false                    # 前後の文を渡すつなぎは eleven_v3 では使えない（v2 なら true）
  max_chunk_chars: 450             # v3 は章ごとにまとめて生成（長い章はこの字数で区間の切れ目で分ける）。次の文を足して無音で切る（F-019）
  seed: 42
  # 区切りの間（秒）
  lead: 1.2
  gap: 0.45
  chapter_gap: 0.9
  tail: 6.0
  trim_silence_db: -45             # 生成音声の頭と末尾の無音を、このレベルで切りそろえる

# 声を作る前の仮の尺（pipeline/estimate_timeline.py）。読み（read）の文字数／秒。本番の声で作り直すと上書きされる
estimate:
  chars_per_sec: 5.55  # Otani・v3（章ごとにまとめて生成）の実測 5.55字/秒（002、読み仮名の字数で）
  pause_sec: 1.1       # 同じく文と文の間の実測（平均1.1秒）。区間ごとに作る v2 なら tts.gap（0.45秒）

audio:
  narration_lufs: -16    # ナレーションの音量（ラウドネス）
  bgm_lufs: -16          # BGMを一旦この音量にそろえてから、下の倍率で下げる
  bgm_gain_speech: 0.16  # 話している間（約 -16dB）
  bgm_gain_gap: 0.32     # 話していない間（約 -10dB）
  bgm_duck_frames: 12    # 声の前後で音量を切り替える時間

# 効果音（F-012）。音の台帳と画面ごとの既定は config/sfx.yaml、根拠は docs/sfx-research.md
sfx:
  target_interval_sec: [6, 10]  # 平均の間隔の目安。6秒より詰めない（前の音への反応が終わる前に次が来る）
  min_gap_sec: 2.5              # これより近い2つの音は、後ろの小さい方を落とす（hit は落とさない）
  max_gap_sec: 12               # これより長く効果音がない所を香盤表の注意に出す
  hit_per_min_max: 1.2          # 強い音（hit）は1分に約1回まで
  same_in_row_max: 1            # 同じファイルを続けて鳴らさない（同じ音は慣れて効かなくなる）
  db_below_voice: {bed: 24, light: 16, mid: 12, hit: 11}  # 声より何dB小さく置くか（短時間ラウドネス）。耳で確かめて直す。hit は 8 だと声の山と重なって音割れした（2026-11-25）

# 香盤表の画面の決まり（pipeline/shotlist.py が注意を出す）
shots:
  material_max: 2          # 同じ写真・資料・航空写真・地図（同じ見せ方と点）は1本で2回まで（F-021。使い回しはくどく、テンポも落ちる）
  insert_variant_max: 3    # 同じイメージ映像の同じ種類（同じ角度）は3回まで
  reuse_needs_reason: true # 2回目からは visual.reuse に理由を書く（ナレーションが中身を指すときだけ。埋めるための使い回しは不可：F-029）
  person_first_sec: 30     # 本人の姿（episode.yaml の person_photos）を最初の30秒以内に出す（F-022）
  card_max_sec: 5.0        # 文字カードは約4秒まで。これを超えたら注意（F-023。長く見せると離脱されやすい）。遺族の言葉など切らないカードは visual.keep に理由
  busy_run: 5             # 5秒未満の絵がこの回数続いたら注意（F-034。カードと短いイメージ映像の交互はせわしない）
  busy_sec: 5.0
  doc_min_sec: 5.0         # 日本語の説明つきの資料は5秒以上出す（F-044。短いと説明を読み切れない）

render:
  gl_linux: swangle    # クラウド（GPUなし）
  gl_windows: angle    # Windows（GPUあり）
  gl_mac: angle
  jpeg_quality: 92
  crf: 18

qa:
  flicker_px: 20              # 明るさが上下に反転した画素のうち、3x3以上のまとまりがこれを超えたらチラつき
  flicker_max_frames: 0
  black_max_luma: 16          # 縮小画像の最大輝度がこれ未満なら真っ黒なフレーム
  loudness_lufs: [-17.5, -13.5]
  bgm_gap_lufs: [-34, -22]    # ナレーションがない区間（冒頭・末尾）でBGMが聞こえるか
  bgm_under_speech_db: [-24, -10]  # 話している間のBGMが、声に対して何dB下か
  sync_max_ms: 40
  asr_min_ratio: 0.85
